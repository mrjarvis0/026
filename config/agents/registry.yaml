# 026 Agent Registry
# ------------------------------------------------------------------------------
# The single list of which agents exist in the fleet and whether they are enabled.
# The orchestrator reads this to know who it may route to; each entry points at
# the agent's own manifest (agents/<dir>/agent.yaml), which is the full contract.
#
# `enabled` here means "declared and loadable as a fleet member" — NOT that the
# agent is wired to the shared kernel yet (bus/brain/sentinel wiring = SP-4) nor
# runtime-verified (SP-5). Reflects the real state, per AGENTS.md §0 laws.
#
# Spec: AGENTS.md §2 (manifest) · §3 (the fleet) · docs/manual/02-structure.md.

