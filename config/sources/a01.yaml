# 026 machine-config — A01 (Blockchain Intelligence) source access.
# ---------------------------------------------------------------------------
# The machine layer for A01's sources: which catalogued sources it uses, their
# access method, and the key-NAME (env var) a connector reads. Real keys live in
# `.env` ONLY — never here. Every entry references a stable ID in the source
# registry (`sources/README.md` master index), so this file and the catalog stay
# in lockstep.
#
# This does NOT replace or modify A01's own live RPC resolution
# (`agents/A01_Blockchain_Intelligence/config/rpc/`, which its 1831 tests cover).
# It is the governed catalog that side converges on when connectors are wired.
# `key_env: TBV` = exact env-var name still to be confirmed.

version: 1
agent: A01
updated: 2026-09-07
source_registry: ../../sources/README.md   # authoritative catalog + stable IDs

