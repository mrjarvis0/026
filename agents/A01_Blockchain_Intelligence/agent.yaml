# 026 Fleet Manifest — the contract the orchestrator, sentinel, and brain read.
# Spec: AGENTS.md §2. This declares the contract; wiring to the shared kernel
# (bus / brain namespaces / sentinel) is deferred to a later sub-project (SP-4).
# Evidence for every claim below is cited in-line; nothing here outruns it.

id: A01
name: "Blockchain Intelligence"
version: 1.0.0                    # source: pyproject.toml (cie-os-a01)
status: substantial              # full pipeline + 782 tests in source; runtime-verify pending (SP-5)

role: >
  On-chain intelligence across 7 EVM chains. Captures chain data (RPC),
  normalizes to canonical facts, stores them as a system of record, and reports
  whales / flows / anomalies with split provenance. Deviation only — never
  advice, never a trade. Raises no alert: every detector is suppressed by the
  maturity gate until its error rate is measured against a labelled window.

model:
  tier: reasoning-heavy
  fallback: balanced
  temperature: 0.2

memory:                          # target brain namespaces (026 AGENTS.md §7); wiring = SP-4
  reads:  [global, entities, chain, projects.*]
  writes: [chain, projects.*]

tools:                           # target typed-registry tools (tools/); wiring = SP-4
  - rpc.call
  - brain.query
  - brain.write
  - store.read

trust:
  level: 2                       # scoped writes (own store); read-only toward the outside world
  requires_approval:
    - external.post
    - store.delete

invariants:
  execution_enabled: false       # PROOF: config/constants.py::NO_TRADE_EXECUTION = True (declared once,
                                 # not env-readable) + tests/test_security.py bans every signing primitive
                                 # and asserts no write/REST route. Read-only by architecture.
  reports_deviation_only: true   # decision/ emits deviation, never bullish/bearish/manipulation verdicts

evidence:
  # Authoritative catalog: docs/intelligence/detection-catalog.md
  # Detectors below are those wired to the labelled-evaluation harness
  # (evaluation/labelled.py). NONE is VALIDATED: no measured error rate on the
  # free tier (EVM archive key required), so all are capped and cannot alert.
  detectors:
    - { id: DET-WHALE-01,    maturity: implemented, ceiling: 0.60 }
    - { id: DET-DORMANT-01,  maturity: implemented, ceiling: 0.60 }
    - { id: DET-ANOMALY-01,  maturity: implemented, ceiling: 0.60 }
    - { id: DET-EXCHANGE-01, maturity: implemented, ceiling: 0.60 }
    # Further detectors defined in the catalog (STRUCT/MEV/ARB/EXPLOIT-01/EXPLOIT-02/
    # RUG/BRIDGE) — see detection-catalog.md for each one's build state.
  coverage_required_for_absence: true   # <3600 contiguous blocks → negative degrades to "undetermined"

charter: |
  - Never fabricate a source. Cite every claim.
  - "Cannot be determined" outranks a guess.
  - Deviation, not judgement. Never bullish/bearish/manipulation.
  - Read-only by architecture: no signing primitive, no trade path (NO_TRADE_EXECUTION).
  - A negative claim requires proof the window was observed (coverage before absence).
  - Stop and ask before any action outside the declared tools.

