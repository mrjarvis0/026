# 026 Fleet Manifest — the contract the orchestrator, sentinel, and brain read.
# Spec: AGENTS.md §2. This declares the contract; wiring to the shared kernel
# (bus / brain namespaces / sentinel) is deferred to a later sub-project (SP-4).
# Evidence for every claim below is cited in-line; nothing here outruns it.

id: A02
name: "News Intelligence"
version: 0.1.0                    # source: config/constants.py::AGENT_VERSION
status: substantial              # phases 0–7 in source + offline test suites; runtime-verify pending (SP-5)

role: >
  Fake-news / rumor intelligence for financial markets. Detects, tracks and
  verifies narratives across news + social + market data, and predicts their
  impact on stocks, crypto and forex as probability + range + confidence.
  Never a binary FAKE/REAL verdict; never a trade. Predictions carry uncertainty.

model:
  tier: reasoning-heavy
  fallback: balanced
  temperature: 0.2

memory:                          # target brain namespaces (026 AGENTS.md §7); wiring = SP-4
  reads:  [global, entities, news, projects.*]
  writes: [news, projects.*]

tools:                           # target typed-registry tools (tools/); wiring = SP-4
  - http.get                     # read-only source fetch (news/social/market APIs)
  - brain.query
  - brain.write
  - store.read

trust:
  level: 2                       # scoped writes (own store); read-only toward the outside world
  requires_approval:
    - external.post
    - store.delete

invariants:
  execution_enabled: false       # no wallet / signing / order path exists (news agent, prediction only)
  reports_deviation_only: true   # graded epistemic verdict, never a certainty and never a trade signal

evidence:
  # A02 uses graded verdicts + measured calibration rather than DET- detector IDs.
  # PROOF of the evidence discipline: config/constants.py — EpistemicStatus is a
  # 7-level graded scale (confirmed_true … fabricated), FOMO / COORDINATION /
  # CONFIDENCE are SEPARATE scores (never merged), MIN_CONFIRMATION_SOURCES = 2.
  detectors:
    - { id: verification,  maturity: implemented, note: "graded epistemic verdict + confidence" }
    - { id: manipulation,  maturity: implemented, note: "coordination score, separate from truth" }
    - { id: impact,        maturity: implemented, note: "probability + range prediction, calibrated" }
  measurement:                   # the maturity harness (Phase 5): outcomes → accuracy/Brier/calibration/drift
    calibration: true
    brier_score: true
    drift_monitor: true
  coverage_required_for_absence: true   # source-level dedup: 10 copies of 1 tweet ≠ 10 confirmations

charter: |
  - No FAKE/REAL binary. Output = evidence + epistemic status + confidence + impact range + uncertainty.
  - FOMO ≠ Truth ≠ Coordination — separate scores, never merged into one.
  - Predictions are always probability + range + confidence, never certainty.
  - Dedup at source level; copies are not confirmations.
  - All API keys optional — degraded mode without keys, never a fabricated fill.
  - Stop and ask before any action outside the declared tools.

